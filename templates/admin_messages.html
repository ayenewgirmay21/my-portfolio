<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Inbox | Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 30px auto;
            padding: 16px;
            background: #f1f5f9;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .message {
            background: white;
            padding: 20px;
            margin: 16px 0;
            border-radius: 10px;
            box-shadow: 0 2px 10px #0001;
            overflow-wrap: anywhere;
        }
        .muted { color: #64748b; }
        button {
            background: #075985;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>My Message Inbox</h1>
        <form method="POST" action="{{ url_for('admin_logout') }}">
            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">
            <button type="submit">Log Out</button>
        </form>
    </div>

    <p>Total messages: {{ messages|length }}</p>

    {% for item in messages %}
        <article class="message">
            <h2>{{ item["name"] }}</h2>
            <p>
                <strong>Email:</strong>
                <a href="mailto:{{ item['email'] }}">
                    {{ item["email"] }}
                </a>
            </p>
            <p class="muted">
                Received: {{ item["created_at"] }}
            </p>
            <p>{{ item["message"] }}</p>
        </article>
    {% else %}
        <p>Your inbox is empty. Messages will appear here
           when visitors contact you.</p>
    {% endfor %}
</body>
</html>
